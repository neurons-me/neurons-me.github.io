<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>neurons.me</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #000000, #050505, #0d0d0d);
      color: #00ffe0;
      font-family: 'Orbitron', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    h1 {
      font-size: 3rem;
      text-shadow: 0 0 10px #00ffe0, 0 0 20px #00ffe0;
    }
    p {
      font-size: 1.2rem;
      margin-top: 0.5em;
      color: #c0ffef;
    }
    .links {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }
    .links a {
      color: #00ffe0;
      text-decoration: none;
      padding: 0.6em 1.2em;
      border: 1px solid #00ffe0;
      border-radius: 4px;
      transition: background 0.3s;
    }
    .links a:hover {
      background: #00ffe0;
      color: #000;
    }
    .footer {
      position: absolute;
      bottom: 1em;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>neurons.me</h1>
  <p>Go Algorithmic.</p>
  <div class="links">
    <a href="https://github.com/neurons-me/neurons-me">neurons-me</a>
    <a href="https://github.com/neurons-me/all.this">all.this</a>
    <a href="https://github.com/neurons-me/cleaker.me">cleaker.me</a>
    <a href="https://docs.neurons.me">docs</a>
  </div>
  <div class="footer">
    &copy; 2025 neurons.me 
  </div>
</body>
</html>
